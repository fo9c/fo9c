  <title id="title">Custom now playing music player</title>
  <desc id="desc">A self-contained animated music player card with album art, track information, and an equalizer.</desc>
  <defs>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="coverGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#39D353"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <linearGradient id="barGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39D353"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <filter id="coverShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="coverClip">
      <rect x="7" y="7" width="121" height="121" rx="6"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="539" height="134" rx="6" fill="url(#cardGradient)" stroke="#30363D"/>

