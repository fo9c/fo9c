<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Gold gradient banner</title>
  <desc id="desc">FO9C anime tech lab gold gradient banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#171129"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#fff7ad"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="150" rx="24" fill="url(#bg)"/>
  <path d="M0 118 C180 65 270 155 450 105 S760 50 1200 116 V150 H0Z" fill="#ec4899" opacity=".18"/>
  <g fill="#fde68a" opacity=".9"><circle cx="92" cy="32" r="3"/><circle cx="1045" cy="36" r="3"/><circle cx="1110" cy="98" r="2"/><circle cx="185" cy="112" r="2"/></g>
  <text x="600" y="72" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="800" letter-spacing="3" fill="url(#gold)" filter="url(#glow)">FO9C · ANIME TECH LAB</text>
  <text x="600" y="108" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" letter-spacing="5" fill="#fce7f3">BUILD SMALL WORLDS WITH CODE ✦</text>
</svg>
