name: Update README status

on:
  schedule:
    - cron: "0,30,40 * * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update time based profile states
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import re

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          weekday = now.weekday() < 5
          minutes = now.hour * 60 + now.minute

          coding = weekday and 8 * 60 + 40 <= minutes < 18 * 60 + 40
          anime = 22 * 60 <= minutes < 23 * 60 + 30
          system = 7 * 60 + 30 <= minutes < 24 * 60

          states = {
              "CODING": ("on" if coding else "off", "ON" if coding else "OFF"),
              "ANIME": ("active" if anime else "idle", "ACTIVE" if anime else "IDLE"),
              "SYSTEM": ("online" if system else "offline", "ONLINE" if system else "OFFLINE"),
          }
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          for key, (asset, label) in states.items():
              start, end = f"<!-- {key}_STATUS_START -->", f"<!-- {key}_STATUS_END -->"
              pattern = re.escape(start) + r".*?" + re.escape(end)
              replacement = f'{start}<img src="https://raw.githubusercontent.com/fo9c/fo9c/main/image/status-{asset}.svg?v=1" height="20" align="absmiddle" alt="{key.title()}: {label}">{end}'
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Missing marker for {key}")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit status changes
        shell: bash
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update profile status [skip actions]"
          git push
